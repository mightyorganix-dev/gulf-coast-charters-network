<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Catalog | Gulf Coast Charters Network</title>
  <meta name="description" content="Filter Items — offshore, inshore, shared, party, dolphin, sunset, jet ski, parasail, pontoon, private yacht, spearfishing." />
  <script type="module" crossorigin src="./assets/trips-BSrqg6FK.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/layout-YHxjb9E0.js">
  <link rel="stylesheet" crossorigin href="./assets/layout-D-KLCwv6.css">
</head>
<body>
  <div id="site-nav"></div>
  <header class="page-hero">
    <div class="container">
      <div class="eyebrow">Items catalog</div>
      <h1>Trips worth dressing up for</h1>
      <p>Bookable products with duration, price, capacity, and deposit. Filter by fishing, adventures, watersports, or private yacht.</p>
    </div>
  </header>
  <main class="page" style="padding-top:0">
    <div class="container">
      <div class="filters">
        <div class="field"><label for="f-q">Search</label><input id="f-q" type="search" placeholder="Captain, trip, marina…"></div>
        <div class="field"><label for="f-group">Hub group</label>
          <select id="f-group">
            <option value="all">All groups</option>
            <option value="fishing">Fishing</option>
            <option value="adventures">Adventures</option>
            <option value="watersports">Watersports</option>
            <option value="private">Private yacht</option>
            <option value="sister">Spearfishing</option>
          </select>
        </div>
        <div class="field"><label for="f-category">Type</label>
          <select id="f-category">
            <option value="all">All types</option>
            <option value="offshore">Offshore fishing</option>
            <option value="inshore">Inshore fishing</option>
            <option value="shared">Shared fishing</option>
            <option value="party">Party boat</option>
            <option value="spearfishing">Spearfishing</option>
            <option value="dolphin">Dolphin cruise</option>
            <option value="sunset">Sunset cruise</option>
            <option value="jetski">Jet ski</option>
            <option value="watersports">Parasail &amp; tow</option>
            <option value="pontoon">Pontoon / bay</option>
            <option value="private">Private yacht</option>
          </select>
        </div>
        <div class="field"><label for="f-marina">Marina</label><select id="f-marina"></select></div>
        <div class="field"><label for="f-price">Max price</label>
          <select id="f-price">
            <option value="">Any</option>
            <option value="100">Under $100</option>
            <option value="500">Under $500</option>
            <option value="1000">Under $1,000</option>
            <option value="2000">Under $2,000</option>
            <option value="5000">Under $5,000</option>
          </select>
        </div>
        <div class="field"><label for="f-party">Party size</label>
          <select id="f-party">
            <option value="">Any</option>
            <option value="2">2+</option>
            <option value="4">4+</option>
            <option value="6">6+</option>
            <option value="10">10+</option>
          </select>
        </div>
        <div class="field" style="display:flex;align-items:flex-end"><span id="trips-count" class="muted" style="font-size:0.85rem"></span></div>
      </div>
      <div class="card-grid" id="trips-grid"></div>
    </div>
  </main>

  <div id="site-footer"></div>
</body>
</html>
